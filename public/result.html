<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Payment Result | Webpay Plus</title>
      <link rel="stylesheet" href="/css/styles.css" />
   </head>
   <body>
      <main>
         <section id="payment-result">
            <h1 id="result-title">Payment result</h1>
            <p id="result-message">Your transaction has been processed.</p>

            <dl>
               <div>
                  <dt>Amount</dt>
                  <dd id="amount">-</dd>
               </div>

               <div>
                  <dt>Buy order</dt>
                  <dd id="buy-order">-</dd>
               </div>

               <div>
                  <dt>Authorization code</dt>
                  <dd id="authorization-code">-</dd>
               </div>
            </dl>

            <a href="/">New payment</a>
         </section>
      </main>

      <script src="scripts/result.js"></script>
   </body>
</html>
